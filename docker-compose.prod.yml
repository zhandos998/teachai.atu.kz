services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    ports:
      - "8081:80"
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-teachai}
      MYSQL_USER: ${DB_USERNAME:-teachai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-teachai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${DB_USERNAME} --password=$${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
