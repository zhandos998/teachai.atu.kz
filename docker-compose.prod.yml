services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    image: teachai-app:prod
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1:8081}:80"
    env_file:
      - .env.docker
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in .env.docker and pass --env-file .env.docker}"
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME in .env.docker and pass --env-file .env.docker}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.docker and pass --env-file .env.docker}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD in .env.docker and pass --env-file .env.docker}}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_BIND:-127.0.0.1:3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} --password=$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: "${PHPMYADMIN_UPLOAD_LIMIT:-64M}"
    ports:
      - "${PHPMYADMIN_BIND:-127.0.0.1:8082}:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
