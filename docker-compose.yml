services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    ports:
      - "8081:80"
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "if [ ! -f node_modules/.package-lock.json ]; then npm ci; fi && npm run dev"
    ports:
      - "5173:5173"
    env_file:
      - .env.docker
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
      VITE_PORT: "5173"
      VITE_HMR_PORT: "5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-teachai}
      MYSQL_USER: ${DB_USERNAME:-teachai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-teachai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${DB_USERNAME} --password=$${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  vendor:
  node_modules:
