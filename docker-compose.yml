services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    ports:
      - "8081:80"
    env_file:
      - .env.docker
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "if [ ! -f node_modules/.package-lock.json ]; then npm ci; fi && npm run dev"
    ports:
      - "5173:5173"
    env_file:
      - .env.docker
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
      VITE_PORT: "5173"
      VITE_HMR_PORT: "5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?Set DB_DATABASE in .env.docker and pass --env-file .env.docker}"
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME in .env.docker and pass --env-file .env.docker}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.docker and pass --env-file .env.docker}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD in .env.docker and pass --env-file .env.docker}}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} --password=$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  vendor:
  node_modules:
